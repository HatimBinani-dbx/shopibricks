# ShopiBricks x Unity Gateway, second deployment. Copy to app/app.showcase.yaml and fill the placeholders.
# scripts/deploy-showcase.sh stages it as app.yaml; the reference app.yaml is untouched.
command: ["npm", "start"]
env:
  - name: NODE_ENV
    value: production
  - name: SHOPIBRICKS_MODEL
    value: <catalog>.<schema>.concierge   # custom Unity Gateway model service
  - name: SHOPIBRICKS_UG_ALLOW_ROUTING
    value: "1"
  - name: SHOPIBRICKS_CATALOG
    value: <catalog>
  - name: SHOPIBRICKS_SCHEMA
    value: <schema>
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: mlflow
  - name: MLFLOW_ASYNC_TRACE_LOGGING_RETRY_TIMEOUT
    value: "15"
  - name: SHOPIBRICKS_PUBLIC_URL
    value: https://<app-url>
  - name: SHOPIBRICKS_UG_USAGE_TABLE   # optional workspace-scoped view over system.ai_gateway.usage
    value: <catalog>.<schema>.gateway_usage
  # Analytics assets created by scripts/provision-showcase.sh (values printed in resources/showcase.provisioned.json)
  - name: SHOPIBRICKS_VECTOR_INDEX
    value: <catalog>.<schema>.products_index
  - name: SHOPIBRICKS_GENIE_SPACE_ID
    value: <genie-space-id>
  - name: SHOPIBRICKS_STREAM_JOB_ID
    valueFrom: stream-job
  - name: SHOPIBRICKS_REFRESH_JOB_ID
    valueFrom: refresh-job
  - name: SHOPIBRICKS_PIPELINE_ID
    value: <pipeline-id>
  # Optional: point the console links to another workspace instead (SHOPIBRICKS_LINK_DATA_HOST,
  # SHOPIBRICKS_LINK_PIPELINE_ID, SHOPIBRICKS_LINK_STREAM_JOB_ID, SHOPIBRICKS_LINK_GENIE_SPACE_ID).
